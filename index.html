<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>売上ダッシュボード</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #1a1a2e;
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
}
#app {
  max-width: 480px;
  margin: 0 auto;
  background: #f5f4f0;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  overflow-x: hidden;
}

/* TOPBAR */
.topbar {
  background: #1a1a2e;
  padding: 52px 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.topbar-title { color:#fff; font-size:15px; font-weight:500; letter-spacing:0.02em; }
.notif-dot { width:7px; height:7px; background:#e24b4a; border-radius:50%; display:inline-block; margin-left:6px; vertical-align:middle; }
.topbar-date { color:rgba(255,255,255,0.55); font-size:12px; }

/* LOADING */
.loading-screen {
  position: absolute; inset: 0;
  background: #1a1a2e;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; z-index: 999;
}
.loading-screen.hidden { display: none; }
.loading-spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(255,255,255,0.15);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: rgba(255,255,255,0.6); font-size: 13px; }

/* ERROR BAR */
.error-bar {
  margin: 12px 14px 0;
  background: #fde8e8; border-radius: 10px;
  padding: 9px 12px; border: 0.5px solid #f5a0a0;
  display: none; align-items: center; gap: 8px;
}
.error-bar.show { display: flex; }
.error-text { font-size: 11.5px; color: #c0392b; }

/* NOTIF BAR */
.notif-bar {
  margin: 12px 14px 0;
  background: #eaf3de; border-radius: 10px;
  padding: 9px 12px; border: 0.5px solid #c0dd97;
  display: flex; align-items: center; gap: 8px;
}
.notif-icon {
  width:18px; height:18px; background:#639922; border-radius:50%;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.notif-text { font-size:11.5px; color:#3b6d11; line-height:1.4; }

/* TOTAL CARD */
.total-card {
  background: #1a1a2e;
  border-radius: 16px;
  padding: 14px 16px 14px;
  margin: 12px 14px 0;
}
.total-top-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 6px;
}
.total-top-left { display:flex; align-items:center; gap:6px; }
.total-date { font-size: 13px; font-weight: 600; color: #fff; letter-spacing: 0.01em; }
.total-label { font-size: 10px; color: rgba(255,255,255,0.4); letter-spacing: 0.08em; text-transform: uppercase; }
.badge-updated { display:inline-block; background:#1d9e75; color:#e1f5ee; font-size:9px; padding:2px 7px; border-radius:99px; }

.cal-btn {
  background: rgba(255,255,255,0.12);
  border: 1.5px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  width: 64px; height: 64px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.cal-btn:active { background: rgba(255,255,255,0.22); }

.total-amount-row { display: flex; align-items: baseline; }
.total-amount-left { display:flex; align-items:baseline; gap:8px; }
.total-amount { font-size:32px; font-weight:500; color:#fff; letter-spacing:-0.01em; }
.total-sokuchi { font-size:15px; color:rgba(255,255,255,0.35); }

.total-divider { border:none; border-top:1px solid rgba(255,255,255,0.08); margin:10px 0 8px; }
.monthly-row { display:flex; justify-content:space-between; align-items:center; }
.monthly-label { font-size:10px; color:rgba(255,255,255,0.4); letter-spacing:0.06em; }
.monthly-right { display:flex; align-items:baseline; gap:8px; }
.monthly-amount { font-size:15px; font-weight:500; color:rgba(255,255,255,0.85); }
.yoy-badge { font-size:10px; padding:2px 7px; border-radius:99px; font-weight:500; }
.yoy-up   { background:rgba(29,158,117,0.25); color:#4ecba3; }
.yoy-down { background:rgba(226,75,74,0.2);   color:#f07070; }

/* SECTION */
.section { padding: 14px 14px 0; }
.section-label { font-size:10px; color:#999; text-transform:uppercase; letter-spacing:0.1em; margin-bottom:8px; }

/* STORE LIST */
.store-list { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.store-card {
  background:#fff; border-radius:14px; border:0.5px solid #e8e8e4;
  padding:12px 12px 10px; display:flex; flex-direction:column; align-items:flex-start; gap:8px;
  cursor:pointer; transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.store-card:active { transform:scale(0.98); background:#f8f8f5; }

/* ロゴ */
.store-logo {
  width: 100%; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  overflow: hidden; background: #f5f5f3;
}
.store-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px 8px; }
.store-logo-text { font-size: 12px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
.detail-logo {
  width: 80px; height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  overflow: hidden; background: rgba(255,255,255,0.15);
}
.detail-logo img { width: 100%; height: 100%; object-fit: contain; padding: 2px 6px; }
.detail-logo-text { font-size: 11px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }

.store-info { width:100%; display:flex; align-items:baseline; justify-content:space-between; }
.store-amount { font-size:19px; font-weight:700; color:#1a1a2e; line-height:1; }
.store-share  { font-size:11px; color:#bbb; text-align:right; }

/* CALENDAR OVERLAY */
.cal-overlay {
  display:none; position:absolute; top:0; left:0; right:0; bottom:0;
  background:rgba(10,10,20,0.6); z-index:200;
  align-items:flex-end; backdrop-filter:blur(4px);
}
.cal-overlay.open { display:flex; }
.cal-sheet { background:#fff; border-radius:24px 24px 0 0; padding:20px 16px 40px; width:100%; }
.cal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.cal-title  { font-size:15px; font-weight:500; color:#1a1a2e; }
.cal-close  { background:none; border:none; font-size:20px; color:#999; cursor:pointer; padding:4px; }
.cal-nav    { display:flex; align-items:center; gap:12px; justify-content:center; margin-bottom:14px; }
.cal-nav-btn { background:#f0efeb; border:none; border-radius:8px; padding:6px 14px; cursor:pointer; font-size:16px; color:#555; }
.cal-month-label { font-size:14px; font-weight:500; color:#1a1a2e; min-width:100px; text-align:center; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-dow  { font-size:10px; color:#aaa; text-align:center; padding:4px 0; }
.cal-day  { aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:13px; border-radius:8px; cursor:default; color:#ccc; }
.cal-day.has-data  { color:#1a1a2e; font-weight:500; cursor:pointer; }
.cal-day.has-data:hover { background:#f0efeb; }
.cal-day.selected  { background:#1a1a2e !important; color:#fff !important; }
.cal-day.today     { color:#1d9e75; font-weight:600; }

/* STORE DETAIL OVERLAY */
.detail-overlay {
  display:none; position:absolute; top:0; left:0; right:0; bottom:0;
  background:#f5f4f0; z-index:300; flex-direction:column; overflow-y:auto;
}
.detail-overlay.open { display:flex; }
.detail-topbar {
  background:#1a1a2e; padding:52px 16px 12px;
  display:flex; align-items:center; gap:10px;
  position:sticky; top:0; z-index:10;
}
.back-btn    { background:none; border:none; color:rgba(255,255,255,0.7); font-size:20px; cursor:pointer; padding:2px 6px; }
.detail-title { color:#fff; font-size:14px; font-weight:500; }
.detail-body { padding:14px 14px 40px; }
.detail-month-nav {
  display:flex; align-items:center; justify-content:space-between;
  background:#fff; border-radius:10px; padding:8px 12px;
  margin-bottom:14px; border:1px solid #e8e8e4;
}
.detail-month-nav-btn {
  background:none; border:none; font-size:20px; color:#1a1a2e;
  cursor:pointer; padding:2px 8px; border-radius:6px; line-height:1;
}
.detail-month-nav-btn:active   { background:#f0f0ec; }
.detail-month-nav-btn:disabled { color:#ccc; cursor:default; }
.detail-month-nav-label { font-size:14px; font-weight:600; color:#1a1a2e; }
.detail-month-label { font-size:10px; color:#999; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:6px; }
.detail-month-total { font-size:22px; font-weight:500; color:#1a1a2e; margin-bottom:4px; }
.detail-month-yoy   { font-size:12px; margin-bottom:16px; }
.detail-table { width:100%; border-collapse:collapse; }
.detail-table th {
  font-size:10px; color:#aaa; text-transform:uppercase;
  letter-spacing:0.06em; padding:6px 0; border-bottom:1px solid #e8e8e4; text-align:right;
}
.detail-table th:first-child { text-align:left; }
.detail-table td {
  font-size:13px; color:#333; padding:9px 0;
  border-bottom:0.5px solid #f0efeb; text-align:right; vertical-align:middle;
}
.detail-table td:first-child { text-align:left; color:#666; font-size:12px; }
.detail-table tr:last-child td { border-bottom:none; }
.yoy-up-text   { color:#1d9e75; font-size:11px; }
.yoy-down-text { color:#e24b4a; font-size:11px; }
.yoy-neutral   { color:#aaa; font-size:11px; }
.pb { padding-bottom:2rem; }
</style>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<body>
<div id="app">

  <!-- ローディング画面 -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <div class="loading-text">データを読み込み中...</div>
  </div>

  <div class="topbar">
    <span class="topbar-title">売上ダッシュボード<span class="notif-dot"></span></span>
    <span class="topbar-date" id="topbarDate"></span>
  </div>

  <div class="error-bar" id="errorBar">
    <span class="error-text" id="errorText">データの取得に失敗しました</span>
  </div>

  <div class="notif-bar">
    <div class="notif-icon">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <path d="M5 2v3.5l2 1.2" stroke="#eaf3de" stroke-width="1.2" stroke-linecap="round"/>
        <circle cx="5" cy="5" r="4" stroke="#eaf3de" stroke-width="1"/>
      </svg>
    </div>
    <span class="notif-text" id="notifText">読み込み中...</span>
  </div>

  <div class="total-card">
    <div class="total-top-row">
      <div class="total-top-left">
        <span class="total-date" id="totalDate">—</span>
        <span class="total-label">全店舗計</span>
        <span class="badge-updated">速報値</span>
      </div>
      <button class="cal-btn" onclick="openCal()">
        <svg width="36" height="36" viewBox="0 0 22 22" fill="none">
          <rect x="2" y="3.5" width="18" height="16" rx="3" stroke="white" stroke-width="1.6"/>
          <path d="M2 8.5h18" stroke="white" stroke-width="1.6"/>
          <path d="M7 1.5v4M15 1.5v4" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
          <rect x="6" y="12" width="3" height="3" rx="0.8" fill="white" opacity="0.7"/>
          <rect x="10" y="12" width="3" height="3" rx="0.8" fill="white" opacity="0.7"/>
          <rect x="14" y="12" width="3" height="3" rx="0.8" fill="white" opacity="0.4"/>
        </svg>
      </button>
    </div>
    <div class="total-amount-row">
      <div class="total-amount-left">
        <div class="total-amount" id="dailyTotal">—</div>
        <div class="total-sokuchi">速報値</div>
      </div>
    </div>
    <hr class="total-divider">
    <div class="monthly-row">
      <div class="monthly-label" id="monthlyLabel">— 月次</div>
      <div class="monthly-right">
        <div class="monthly-amount" id="monthlyTotal">—</div>
        <span class="yoy-badge yoy-up" id="monthlyYoy" style="display:none"></span>
      </div>
    </div>
  </div>

  <div class="section pb">
    <div class="section-label">店舗別内訳</div>
    <div class="store-list" id="storeList"></div>
  </div>

  <!-- CALENDAR OVERLAY -->
  <div class="cal-overlay" id="calOverlay" onclick="if(event.target===this)closeCal()">
    <div class="cal-sheet">
      <div class="cal-header">
        <span class="cal-title">日付を選択</span>
        <button class="cal-close" onclick="closeCal()">✕</button>
      </div>
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="calPrevMonth()">‹</button>
        <span class="cal-month-label" id="calMonthLabel"></span>
        <button class="cal-nav-btn" onclick="calNextMonth()">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <!-- STORE DETAIL OVERLAY -->
  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-topbar">
      <button class="back-btn" onclick="closeDetail()">‹</button>
      <div id="detailLogo"></div>
      <span class="detail-title" id="detailTitle"></span>
    </div>
    <div class="detail-body">
      <div class="detail-month-nav">
        <button class="detail-month-nav-btn" id="detailPrevBtn" onclick="detailChangeMonth(-1)">‹</button>
        <span class="detail-month-nav-label" id="detailMonthNavLabel"></span>
        <button class="detail-month-nav-btn" id="detailNextBtn" onclick="detailChangeMonth(1)">›</button>
      </div>
      <div class="detail-month-label" id="detailMonthLabel"></div>
      <div class="detail-month-total" id="detailMonthTotal"></div>
      <div class="detail-month-yoy"   id="detailMonthYoy"></div>
      <table class="detail-table">
        <thead><tr><th>日付</th><th>売上</th><th>昨対</th></tr></thead>
        <tbody id="detailTableBody"></tbody>
      </table>
    </div>
  </div>

</div>

    return `<div class="${cls}"><img src="${STORE_LOGOS[i]}" alt="${STORE_NAMES[i]}"></div>`;
  }
  // フォールバック：イニシャル表示
  const txtCls = size === 'detail' ? 'detail-logo-text' : 'store-logo-text';
  return `<div class="${cls}" style="background:${STORE_COLORS[i]}"><span class="${txtCls}">${STORE_INITIALS[i]}</span></div>`;
}

// ─── GASからデータ取得 ────────────────────────────────────────────────────────
async function fetchData() {
  const res  = await fetch(GAS_URL);
  const json = await res.json();
  if (json.status !== 'ok') throw new Error(json.message || 'GAS error');

  // GASのdateは "Sat Mar 01" のような形式で来る場合がある → YYYY-MM-DD に変換
  const MONTHS = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};

  // スプレッドシートの日付範囲から年を推定するため、行インデックスは使わず
  // 前の行の年を引き継ぐ方式で年を補完する
  let currentYear = null;
  let prevMonth   = null;

  return json.rows.map(row => {
    const raw = String(row.date).trim();

    // すでに YYYY-MM-DD 形式ならそのまま
    if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) {
      const y = parseInt(raw.slice(0,4));
      const m = parseInt(raw.slice(5,7));
      currentYear = y;
      prevMonth   = m;
      return { date: raw, total: Number(row.total), stores: (row.stores||[]).map(Number) };
    }

    // "Sat Mar 01" 形式をパース
    const parts = raw.split(' ');
    // parts[0]=曜日, parts[1]=月略称, parts[2]=日
    const monName = parts[parts.length - 2];
    const dayNum  = parseInt(parts[parts.length - 1]);
    const mon     = MONTHS[monName];

    if (!mon || isNaN(dayNum)) return null;

    // 年の推定: 月が前の月より小さくなったら年が変わった
    if (currentYear === null) {
      currentYear = new Date().getFullYear() - 1; // 最初は前年スタートと仮定
    } else if (prevMonth !== null && mon < prevMonth && prevMonth >= 11) {
      currentYear++;
    }
    prevMonth = mon;

    const dateStr = currentYear + '-' + String(mon).padStart(2,'0') + '-' + String(dayNum).padStart(2,'0');
    return { date: dateStr, total: Number(row.total), stores: (row.stores||[]).map(Number) };
  }).filter(r => r && r.date.match(/^\d{4}-\d{2}-\d{2}$/));
}

// ─── 初期化 ───────────────────────────────────────────────────────────────────
async function init() {
  // topbarの日付（今日）
  const today = new Date();
  document.getElementById('topbarDate').textContent =
    today.getFullYear() + '年' + (today.getMonth()+1) + '月' + today.getDate() + '日';

  try {
    const rows = await fetchData();

    // 全年分をそのまま格納
    ALL_DAILY = rows;

    // 最新日付を初期選択
    if (ALL_DAILY.length > 0) {
      selectedDate = ALL_DAILY[ALL_DAILY.length - 1].date;
    }

    // 更新日時を通知バーに表示
    const lastDate = selectedDate
      ? selectedDate.slice(5).replace('-', '/') : '—';
    document.getElementById('notifText').textContent =
      lastDate + ' のデータが最新です';

    // 描画
    renderStores();
    renderCal();

  } catch(err) {
    document.getElementById('errorBar').classList.add('show');
    document.getElementById('errorText').textContent =
      'データ取得エラー: ' + err.message;
    document.getElementById('notifText').textContent = '取得失敗 - 再読み込みしてください';
  } finally {
    document.getElementById('loadingScreen').classList.add('hidden');
  }
}

// ─── メイン：店舗カード描画 ───────────────────────────────────────────────────
function renderStores() {
  const dayData = ALL_DAILY.find(d => d.date === selectedDate);
  const list = document.getElementById('storeList');
  list.innerHTML = '';

  const d = new Date(selectedDate + 'T00:00:00');
  document.getElementById('totalDate').textContent =
    (d.getMonth()+1) + '月' + d.getDate() + '日';
  document.getElementById('dailyTotal').textContent =
    dayData ? fmt(dayData.total) : '—';

  // 月次合計
  const monthStr   = selectedDate.slice(0, 7);
  const monthTotal = ALL_DAILY
    .filter(x => x.date.startsWith(monthStr))
    .reduce((s, x) => s + x.total, 0);
  document.getElementById('monthlyLabel').textContent =
    d.getFullYear() + '年' + (d.getMonth()+1) + '月 月次';
  document.getElementById('monthlyTotal').textContent = fmt(monthTotal);

  // 月次昨対（前年同月をALL_DAILYから取得）
  const lyMonthStr   = (d.getFullYear()-1) + '-' + String(d.getMonth()+1).padStart(2,'0');
  const lyMonthTotal = ALL_DAILY
    .filter(x => x.date.startsWith(lyMonthStr))
    .reduce((s, x) => s + x.total, 0);
  const yoyEl = document.getElementById('monthlyYoy');
  if (lyMonthTotal > 0) {
    const yoy = (monthTotal / lyMonthTotal * 100).toFixed(1);
    const up  = parseFloat(yoy) >= 100;
    yoyEl.textContent  = (up ? '↑ ' : '↓ ') + yoy + '%';
    yoyEl.className    = 'yoy-badge ' + (up ? 'yoy-up' : 'yoy-down');
    yoyEl.style.display = '';
  } else {
    yoyEl.style.display = 'none';
  }

  if (!dayData) return;

  dayData.stores.forEach((amt, i) => {
    const share = dayData.total > 0 ? (amt / dayData.total * 100).toFixed(1) : '0.0';
    const card  = document.createElement('div');
    card.className = 'store-card';
    card.innerHTML = `
      ${logoHTML(i)}
      <div class="store-info">
        <div class="store-amount">${fmt(amt)}</div>
        <div class="store-share">${share}%</div>
      </div>`;
    card.onclick = () => openDetail(i);
    list.appendChild(card);
  });
}

// ─── カレンダー ───────────────────────────────────────────────────────────────
function openCal() {
  const d  = new Date(selectedDate + 'T00:00:00');
  calYear  = d.getFullYear();
  calMonth = d.getMonth() + 1;
  renderCal();
  document.getElementById('calOverlay').classList.add('open');
}
function closeCal()      { document.getElementById('calOverlay').classList.remove('open'); }
function calPrevMonth()  { calMonth--; if(calMonth<1) { calMonth=12; calYear--; } renderCal(); }
function calNextMonth()  { calMonth++; if(calMonth>12){ calMonth=1;  calYear++; } renderCal(); }

function renderCal() {
  document.getElementById('calMonthLabel').textContent = calYear + '年' + calMonth + '月';
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  ['日','月','火','水','木','金','土'].forEach(dow => {
    const el = document.createElement('div');
    el.className = 'cal-dow'; el.textContent = dow; grid.appendChild(el);
  });
  const firstDay    = new Date(calYear, calMonth-1, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth, 0).getDate();
  const availDates  = ALL_DAILY.map(d => d.date);
  const todayStr    = new Date().toISOString().slice(0,10);

  for(let i=0; i<firstDay; i++) grid.appendChild(document.createElement('div'));

  for(let d=1; d<=daysInMonth; d++) {
    const dateStr = calYear + '-' + String(calMonth).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const el = document.createElement('div');
    el.className = 'cal-day'
      + (availDates.includes(dateStr) ? ' has-data' : '')
      + (dateStr === selectedDate     ? ' selected'  : '')
      + (dateStr === todayStr         ? ' today'     : '');
    el.textContent = d;
    if (availDates.includes(dateStr)) {
      el.onclick = () => { selectedDate = dateStr; renderStores(); closeCal(); };
    }
    grid.appendChild(el);
  }
}

// ─── 店舗詳細 ─────────────────────────────────────────────────────────────────
function openDetail(i) {
  detailStoreIndex = i;
  const d    = new Date(selectedDate + 'T00:00:00');
  detailYear  = d.getFullYear();
  detailMonth = d.getMonth() + 1;
  document.getElementById('detailLogo').innerHTML    = logoHTML(i, 'detail');
  document.getElementById('detailTitle').textContent = STORE_NAMES[i];
  renderDetail(i);
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail() { document.getElementById('detailOverlay').classList.remove('open'); }

function detailChangeMonth(dir) {
  detailMonth += dir;
  if(detailMonth > 12){ detailMonth = 1;  detailYear++; }
  if(detailMonth < 1) { detailMonth = 12; detailYear--; }
  renderDetail(detailStoreIndex);
}

function renderDetail(i) {
  const monthStr    = detailYear + '-' + String(detailMonth).padStart(2,'0');
  const monthDays   = ALL_DAILY.filter(d => d.date.startsWith(monthStr));
  const lyMonthStr  = (detailYear-1) + '-' + String(detailMonth).padStart(2,'0');
  const lyMonthDays = ALL_DAILY.filter(d => d.date.startsWith(lyMonthStr));

  document.getElementById('detailMonthNavLabel').textContent = detailYear + '年' + detailMonth + '月';

  // 前後月ボタンの有効/無効
  const allDates = ALL_DAILY.map(d => d.date);
  const minYM = allDates.length ? allDates[0].slice(0,7) : monthStr;
  const maxYM = allDates.length ? allDates[allDates.length-1].slice(0,7) : monthStr;
  document.getElementById('detailPrevBtn').disabled = monthStr <= minYM;
  document.getElementById('detailNextBtn').disabled = monthStr >= maxYM;

  document.getElementById('detailMonthLabel').textContent = detailYear + '年' + detailMonth + '月 月次';

  const monthTotal = monthDays.reduce((s,d) => s + d.stores[i], 0);
  const lyTotal    = lyMonthDays.reduce((s,d) => s + d.stores[i], 0);
  document.getElementById('detailMonthTotal').textContent = fmt(monthTotal);

  if (lyTotal > 0) {
    const yoy = (monthTotal / lyTotal * 100).toFixed(1);
    const up  = parseFloat(yoy) >= 100;
    document.getElementById('detailMonthYoy').innerHTML =
      `<span class="${up?'yoy-up-text':'yoy-down-text'}">${up?'↑':'↓'} 昨対 ${yoy}%</span>`;
  } else {
    document.getElementById('detailMonthYoy').innerHTML =
      '<span class="yoy-neutral">昨対データなし</span>';
  }

  const tbody = document.getElementById('detailTableBody');
  tbody.innerHTML = '';
  if (monthDays.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#aaa;padding:20px;">データなし</td></tr>';
    return;
  }
  monthDays.forEach(day => {
    const amt   = day.stores[i];
    const lyDay = lyMonthDays.find(d => d.date.slice(5) === day.date.slice(5));
    const lyAmt = lyDay ? lyDay.stores[i] : null;
    let yoyHtml = '<span class="yoy-neutral">—</span>';
    if (lyAmt !== null && lyAmt > 0) {
      const yoy = (amt / lyAmt * 100).toFixed(1);
      const up  = parseFloat(yoy) >= 100;
      yoyHtml = `<span class="${up?'yoy-up-text':'yoy-down-text'}">${up?'↑':'↓'}${yoy}%</span>`;
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${day.date.slice(5).replace('-','/')}</td><td>${fmt(amt)}</td><td>${yoyHtml}</td>`;
    tbody.appendChild(tr);
  });
}
